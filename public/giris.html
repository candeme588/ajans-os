<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ajans OS — Giriş</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0e1013;
    color: #e8eaed;
    font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    padding: 20px;
  }
  .kutu {
    width: 100%; max-width: 360px;
    background: #14171c; border: 1px solid #262b34;
    border-radius: 14px; padding: 30px 26px;
  }
  .logo {
    width: 42px; height: 42px; border-radius: 10px; margin-bottom: 16px;
    background: linear-gradient(135deg, #ff6b35, #c94a1d);
    display: grid; place-items: center;
    font-weight: 700; font-size: 15px; letter-spacing: .5px; color: #fff;
  }
  h1 { font-size: 17px; margin: 0 0 6px; font-weight: 650; }
  p { font-size: 12.5px; color: #6b7280; margin: 0 0 22px; line-height: 1.5; }
  label { display: block; font-size: 11px; color: #6b7280; margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 13px; font: inherit; font-size: 14px;
    background: #1b1f26; border: 1px solid #323844; border-radius: 9px;
    color: #e8eaed; outline: none; margin-bottom: 14px;
  }
  input:focus { border-color: #ff6b35; }
  button {
    width: 100%; padding: 11px; font: inherit; font-size: 13.5px; font-weight: 600;
    background: #ff6b35; color: #fff; border: 0; border-radius: 9px; cursor: pointer;
  }
  button:hover { background: #ff8f66; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .hata {
    display: none; font-size: 12px; color: #ffb3b3;
    background: #211414; border: 1px solid #5c2a2a;
    padding: 9px 12px; border-radius: 8px; margin-bottom: 14px;
  }
  .hata.ac { display: block; }
</style>
</head>
<body>
  <div class="kutu">
    <div class="logo">AO</div>
    <h1>Ajans OS</h1>
    <p>Panele erişmek için şifreni gir.</p>
    <div class="hata" id="hata"></div>
    <form id="form">
      <label for="sifre">Şifre</label>
      <input id="sifre" type="password" autocomplete="current-password" autofocus />
      <button type="submit" id="btn">Giriş yap</button>
    </form>
  </div>

<script>
const form = document.getElementById('form');
const hata = document.getElementById('hata');
const btn = document.getElementById('btn');
const sifre = document.getElementById('sifre');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  hata.classList.remove('ac');
  btn.disabled = true;
  btn.textContent = 'Kontrol ediliyor…';

  try {
    const res = await fetch('/api/giris', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sifre: sifre.value })
    });
    const data = await res.json().catch(() => ({}));

    if (res.ok) {
      location.reload();
      return;
    }
    hata.textContent = data.error || 'Giriş başarısız';
    hata.classList.add('ac');
    sifre.select();
  } catch (err) {
    hata.textContent = 'Sunucuya ulaşılamadı';
    hata.classList.add('ac');
  }

  btn.disabled = false;
  btn.textContent = 'Giriş yap';
});
</script>
</body>
</html>
